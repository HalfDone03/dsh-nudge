# dsh-nudge bundle patch.
#
# 一行 insert 即挂载 Host 侧插件；浏览器那一半由 package.json 的 dsh.client 段
# 把 client.js 注入渲染进程（设置页「设置 → 提醒弹窗」）。卡片本身是 Host 侧
# 起的一次性 WPF 进程，不经过渲染进程。
#
# 用户覆盖层（profile 的 cordis.patch.yml）可以按 id 覆盖这里的 config：
#
#   - id: nudge
#     config:
#       staySeconds: 12
#
- insert:
    - id: nudge
      name: 'dsh-nudge'
      config:
        enabled: true
        staySeconds: 15
        showWhenFocused: true
        suppressWhenFullscreen: true
        # 配色：auto 跟随 Windows 的深浅色设置，也可以固定 dark / light
        theme: auto
        # 调试开关：true 时把每次弹出的 payload 追加落盘（debugFile 留空 = %TEMP%\dsh-nudge-payloads.jsonl）
        debugPayload: false
        debugFile: ''
        # 预览开关：true 时卡片常驻，可以拖动缩放，关掉后位置和大小会记住
        debugPreview: false
        # 记住你拖过或缩过的位置；placementFile 留空 = %LOCALAPPDATA%\dsh-nudge\placement.json
        rememberPosition: true
        placementFile: ''
        margin: 16
        mergeWindowMs: 1200
        maxItems: 8
        alertOnToolError: true
        muteRanges: []
