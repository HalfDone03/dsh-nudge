version: 1
targets:
  - id: V1
    what: "在页面底部触发失败（导入非法 JSON），错误文字在视野内可见"
    how: "打开设置页 → 滚到最底 → 导入框填 {bad → 点导入 → 截图"
    expect: "应用栏附近出现红色错误文字，不需要往上滚"
  - id: V2
    what: "改几项不应用就导出，导出的 JSON 是新值"
    how: "改卡片宽度为 400 → 不点应用 → 点导出 → 截图导出框"
    expect: "JSON 里 width 是 400，且框上方标明包含未保存改动"
  - id: V3
    what: "打开「鼠标穿透」后「回到 DSH」自动关闭（视觉上能看出来）"
    how: "点击组 → 打开穿透 → 截图"
    expect: "两颗开关一开一关，且 hint 说明二者二选一"
  - id: V4
    what: "数字框输入后按 Enter 立即进入草稿"
    how: "停留秒数输入 25 → 按 Enter → 截图应用栏"
    expect: "应用栏出现「1 项改动还没保存」，且该组标题带点"
  - id: V5
    what: "预览卡能如实反映语音改动后立即试听"
    how: "语音组切到 TTS → 不应用 → 点试听"
    expect: "听到的是 TTS 声音（不是预制短句）"
